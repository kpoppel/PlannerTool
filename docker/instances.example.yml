ado_authentication: pat
# Select backends in each instance's Admin > Data Sources, not in this file.
# To connect the shared mock auth service, set ado_authentication: entra, uncomment
# auth_services below and add auth_service: central to the desired instances.
# https_hostname: planner.example.test
# auth_services:
#   central:
#     mode: mock
#     environment_id: preview
#     generation: initial
#     public_url: https://planner.example.test/auth/
#     volume_source: auth-central-state
#     registration:
#       tenant_id: 11111111-1111-1111-1111-111111111111
#       client_id: 22222222-2222-2222-2222-222222222222
#       organization: example
# Generated registry and secrets are managed in deployment/.auth/ on --apply.
# Match public_url to https_hostname and use your server's DNS name.
# Mock identities are synthetic and publicly selectable: never use production data.
# An explicit image is image-only unless build_from_source: true is also set.
instances:
  # Default: uses a Docker named volume (data-alpha) and the latest build version
  - name: alpha
    # auth_service: central

  # Explicitly use a local bind mount
  - name: beta
    volume_type: bind
    volume_source: ./data/beta

  # Explicitly use a custom Docker named volume and deploy a specific version
  - name: delta
    image: plannertool:v2.0.0
    volume_type: volume
    volume_source: custom-delta-data

  # Example with an external people database mapped into the container
  - name: gamma
    external_database: /opt/shared/company-people-db.yaml

# Environment variables (set these before running docker compose):
# - PLANNER_SECRET_KEY: Required. Encryption key for PAT storage (generate with: openssl rand -base64 32)
