<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframe — Plans admin</title>
<style>
  :root {
    --ink: #1f2937; --muted: #6b7280; --line: #d1d5db; --soft: #f3f4f6; --bg: #fafafa;
    --accent: #2563eb; --accent-soft: #dbeafe; --warn: #b45309; --warn-soft: #fef3c7;
    --danger: #b91c1c; --ok: #047857; --note: #fff7c2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  button, input, select { font: inherit; }
  .topbar { display: flex; align-items: center; gap: 24px; padding: 10px 20px;
    background: #fff; border-bottom: 1px solid var(--line); }
  .topbar strong { font-size: 15px; }
  .topbar nav { display: flex; gap: 4px; }
  .topbar nav span { padding: 6px 10px; border-radius: 6px; color: var(--muted); }
  .topbar nav span.active { background: var(--soft); color: var(--ink); font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 47px); }
  .subnav { border-right: 1px solid var(--line); background: #fff; padding: 16px 8px; }
  .subnav button { display: flex; justify-content: space-between; width: 100%; text-align: left;
    padding: 8px 12px; border: 0; background: none; border-radius: 6px; cursor: pointer; }
  .subnav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .subnav .count { color: var(--muted); font-weight: 400; }
  .subnav hr { border: 0; border-top: 1px solid var(--line); margin: 12px 4px; }
  .subnav .hint { color: var(--muted); font-size: 12px; padding: 0 12px; }
  main { padding: 24px 32px; max-width: 1100px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .btn { padding: 7px 14px; border: 1px solid var(--line); background: #fff; border-radius: 6px;
    cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.link { border: 0; background: none; color: var(--accent); padding: 4px 6px; }
  .btn.danger { color: var(--danger); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  .toolbar input[type=search] { flex: 1; max-width: 340px; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 6px; }
  .toolbar select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; }
  .toolbar .spacer { flex: 1; }
  .level-block { margin-bottom: 20px; }
  .level-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px;
    color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .plan-list { background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .plan-row { display: grid; grid-template-columns: 20px 1.3fr 1.6fr 1fr 1.1fr auto; gap: 12px;
    align-items: center; padding: 10px 14px; border-top: 1px solid var(--soft); }
  .plan-row .handle { cursor: grab; color: var(--muted); user-select: none; }
  .plan-row.dragging { opacity: .4; }
  .plan-row.drop-target { box-shadow: inset 0 2px 0 var(--accent); }
  .plan-row:first-child { border-top: 0; }
  .plan-row:hover { background: #fcfcfd; }
  .plan-row.archived { color: var(--muted); }
  .plan-name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  .path { font-family: ui-monospace, monospace; font-size: 12px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--soft);
    font-size: 12px; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.accent { background: var(--accent-soft); color: var(--accent); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px;
    margin-bottom: 16px; }
  /* Plan levels */
  .levels { display: flex; flex-direction: column; gap: 0; max-width: 560px; }
  .level-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #fff;
    border: 1px solid var(--line); border-radius: 8px; }
  .level-item .rank { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
  .level-item .grow { flex: 1; }
  .level-connector { width: 2px; height: 14px; background: var(--line); margin-left: 26px; }
  .level-add { display: flex; gap: 8px; margin-top: 16px; max-width: 560px; }
  .level-add input { flex: 1; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; }
  /* Workforce defaults */
  .wf-grid { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
  .wf-levels button { display: block; width: 100%; text-align: left; padding: 10px 12px;
    margin-bottom: 6px; border: 1px solid var(--line); background: #fff; border-radius: 8px;
    cursor: pointer; }
  .wf-levels button.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .summary-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
  .chip.archived { background: var(--warn-soft); color: var(--warn); }
  .chip button { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 4px; }
  .tree { border: 1px solid var(--line); border-radius: 8px; max-height: 360px; overflow: auto;
    background: #fff; }
  .tree-search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
    margin-bottom: 8px; }
  .tree-group { border-top: 1px solid var(--soft); }
  .tree-group:first-child { border-top: 0; }
  .tree-row { display: flex; align-items: center; gap: 8px; padding: 6px 12px; }
  .tree-row.group { background: #fbfbfc; font-weight: 600; }
  .tree-row.team { padding-left: 38px; }
  .tree-row .grow { flex: 1; }
  .tree-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(17, 24, 39, .35); display: none; }
  .scrim.open { display: block; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 620px; background: #fff;
    border-left: 1px solid var(--line); display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .15s; }
  .drawer.open { transform: none; }
  .drawer header { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .drawer .body { flex: 1; overflow: auto; padding: 20px; }
  .drawer footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .drawer footer .spacer { flex: 1; }
  .steps { display: flex; gap: 6px; margin-top: 10px; }
  .steps span { flex: 1; padding: 6px 8px; border-radius: 6px; background: var(--soft);
    font-size: 12px; color: var(--muted); }
  .steps span.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .steps span.done { color: var(--ok); }
  .field { margin-bottom: 18px; }
  .field > label, .field > .label { display: block; font-weight: 600; margin-bottom: 4px; }
  .field .help { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .field input[type=text], .field select { width: 100%; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 6px; }
  .choice-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .choice-cards label { border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
  .choice-cards label.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .area-tree { border: 1px solid var(--line); border-radius: 8px; max-height: 300px; overflow: auto; }
  .area-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer;
    border-top: 1px solid var(--soft); }
  .area-row:first-child { border-top: 0; }
  .area-row:hover { background: var(--soft); }
  .area-row.selected { background: var(--accent-soft); }
  .area-row.used { color: var(--muted); cursor: not-allowed; }
  .area-row .grow { flex: 1; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 24px 0 10px; border-top: 1px solid var(--soft); padding-top: 16px; }
  .section-title:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
  .callout { padding: 10px 12px; border-radius: 6px; background: var(--warn-soft); color: var(--warn);
    font-size: 13px; margin-bottom: 12px; }
  .review dt { color: var(--muted); font-size: 12px; }
  .review dd { margin: 0 0 10px; }
  /* Designer notes */
  .note { display: none; background: var(--note); border: 1px dashed #d4b106; border-radius: 6px;
    padding: 8px 10px; font-size: 12px; margin: 8px 0 14px; }
  .note::before { content: 'NOTE · '; font-weight: 700; }
  body.notes .note { display: block; }
  .menu { position: relative; display: inline-block; }
  .menu-pop { position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid var(--line);
    border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.08); z-index: 5; min-width: 140px; }
  .menu-pop button { display: block; width: 100%; text-align: left; border: 0; background: none;
    padding: 8px 12px; cursor: pointer; }
  .menu-pop button:hover { background: var(--soft); }
  .topbar nav button { padding: 6px 10px; border-radius: 6px; color: var(--muted); border: 0;
    background: none; cursor: pointer; }
  .topbar nav button.active { background: var(--soft); color: var(--ink); font-weight: 600; }
  .layout.full { grid-template-columns: 1fr; }
  .layout.full .subnav { display: none; }
  .st { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
    margin: 2px 4px 2px 0; }
  .st.Proposed { background: #e5e7eb; }
  .st.InProgress { background: #dbeafe; }
  .st.Resolved { background: #ccfbf1; }
  .st.Completed { background: #dcfce7; }
  .st.Removed { background: #fee2e2; }
  .proc-card { background: #fff; border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 12px; }
  .proc-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .proc-head .grow { flex: 1; }
  table.types { width: 100%; border-collapse: collapse; }
  table.types th, table.types td { text-align: left; padding: 8px 14px;
    border-top: 1px solid var(--soft); vertical-align: top; }
  table.types th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr.disabled td { color: var(--muted); }
  .icon { padding: 0 6px; border: 1px solid var(--line); background: #fff; border-radius: 4px;
    cursor: pointer; font-size: 12px; }
  .icon:disabled { opacity: .35; cursor: not-allowed; }
  .global-grid { display: grid; grid-template-columns: 1fr 240px; gap: 20px; align-items: start; }
  .columns { display: flex; gap: 12px; padding: 0 14px 14px; overflow-x: auto; }
  .column { min-width: 210px; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    background: #fbfbfc; }
  .column .type-line { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .column .type-line .grow { flex: 1; font-weight: 600; }
  .column .rank { color: var(--muted); font-size: 12px; width: 18px; }
  .column .states { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
  .sidebar-preview { background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; }
  .sidebar-preview .grp { font-size: 11px; text-transform: uppercase; color: var(--muted);
    margin: 10px 0 4px; letter-spacing: .04em; }
  .sidebar-preview label { display: block; font-size: 13px; padding: 2px 0; }
  .check-line { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  .hierarchy { padding: 0 14px 12px; }
  .sub-title { font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; margin: 4px 0 6px; }
  .level-row { display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-top: 1px dashed var(--soft); }
  .level-label { width: 120px; font-size: 12px; font-weight: 600; }
  .type-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px 3px 10px;
    border: 1px solid var(--line); border-radius: 999px; background: #fff; font-weight: 600; }
</style>
</head>
<body class="notes">
<div class="topbar">
  <strong>PlannerTool Admin</strong>
  <nav id="topnav"></nav>
  <span class="spacer"></span>
  <label class="sub"><input type="checkbox" id="toggle-notes" checked> Show design notes</label>
</div>

<div class="layout">
  <aside class="subnav" id="subnav"></aside>
  <main id="view"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Plan editor"></aside>

<script>
// ---------- Sample data (wireframe only) ----------
const ADO = {
  Platform: [
    'Platform', 'Platform\\Core', 'Platform\\Core\\API', 'Platform\\Core\\Data',
    'Platform\\Core\\Infra', 'Platform\\Web', 'Platform\\Web\\Checkout', 'Platform\\Web\\Search',
  ],
  Mobile: ['Mobile', 'Mobile\\iOS', 'Mobile\\Android', 'Mobile\\Shared'],
  Marketing: ['Marketing', 'Marketing\\Campaigns', 'Marketing\\Events'],
  Archive: ['Archive', 'Archive\\Old'],
};
const s = (name, cat) => ({ name, cat });
const AGILE_STATES = [s('New', 'Proposed'), s('Active', 'InProgress'), s('Resolved', 'Resolved'),
  s('Closed', 'Completed'), s('Removed', 'Removed')];
const STORY_STATES = [s('New', 'Proposed'), s('Active', 'InProgress'), s('In Test', 'Resolved'),
  s('Closed', 'Completed'), s('Removed', 'Removed')];
const TASK_STATES = [s('To Do', 'Proposed'), s('In Progress', 'InProgress'), s('Done', 'Completed')];
const type = (name, level, imported, states, missing = false) =>
  ({ name, level, imported, states, missing });
const HISTORY = [[0, 'None'], [30, '1 month'], [90, '3 months'], [182, '6 months'], [365, '1 year']];
// ADO backlog per type; types sharing a backlog start out as siblings on one level.
const BACKLOG = { Initiative: 'Initiatives', Epic: 'Epics', Feature: 'Features',
  'User Story': 'Stories', Bug: 'Stories', Campaign: 'Campaigns', Deliverable: 'Deliverables',
  Requirement: 'Requirements', 'Change Request': 'Requirements' };
const GROUPS = [
  { id: 'g-core', name: 'Core Platform', archived: false },
  { id: 'g-exp', name: 'Customer Experience', archived: false },
  { id: 'g-legacy', name: 'Legacy Systems', archived: true },
];
const TEAMS = [
  { id: 't-api', name: 'API', group_id: 'g-core', archived: false },
  { id: 't-data', name: 'Data', group_id: 'g-core', archived: false },
  { id: 't-infra', name: 'Infrastructure', group_id: 'g-core', archived: false },
  { id: 't-web', name: 'Web', group_id: 'g-exp', archived: false },
  { id: 't-mob', name: 'Mobile', group_id: 'g-exp', archived: false },
  { id: 't-design', name: 'Design', group_id: 'g-exp', archived: true },
  { id: 't-old', name: 'Mainframe', group_id: 'g-legacy', archived: true },
  { id: 't-sec', name: 'Security', group_id: null, archived: false },
];
const ITERATION_SETS = [
  { id: 'it-2w', name: 'Two-week sprints' },
  { id: 'it-pi', name: 'Program increments' },
];

const state = {
  page: 'plans',
  processes: [
    { id: 'p-agile', name: 'Agile Scrum v20', parent: 'Agile', projects: ['Platform', 'Mobile'],
      types: [
        type('Initiative', 'portfolio', true, AGILE_STATES, true),
        type('Epic', 'portfolio', true, AGILE_STATES),
        type('Feature', 'portfolio', true, AGILE_STATES),
        type('User Story', 'requirement', true, STORY_STATES),
        type('Bug', 'requirement', false, AGILE_STATES),
        type('Task', 'task', false, TASK_STATES),
      ] },
    { id: 'p-mkt', name: 'Marketing', parent: 'Basic', projects: ['Marketing'],
      types: [
        type('Campaign', 'portfolio', true, [s('Idea', 'Proposed'), s('Planned', 'Proposed'),
          s('Running', 'InProgress'), s('Done', 'Completed')]),
        type('Deliverable', 'requirement', true, [s('To Do', 'Proposed'),
          s('Doing', 'InProgress'), s('Review', 'Resolved'), s('Done', 'Completed')]),
        type('Task', 'task', false, TASK_STATES),
      ] },
    { id: 'p-cmmi', name: 'Legacy CMMI', parent: 'CMMI', projects: ['Archive'],
      types: [
        type('Requirement', 'requirement', false, AGILE_STATES),
        type('Change Request', 'requirement', false, AGILE_STATES),
        type('Task', 'task', false, TASK_STATES),
      ] },
  ],
  // Display order (Global settings): processes first, then hierarchy levels; same level = siblings.
  processOrder: ['p-agile', 'p-mkt'],
  typeLevels: { 'p-agile': [['Epic'], ['Feature'], ['User Story']],
    'p-mkt': [['Campaign'], ['Deliverable']], 'p-cmmi': [] },
  adoDraft: null, adoOpen: ['p-agile'], adoError: '', adoLoadedAt: 'today 09:12',
  view: 'plans',
  levels: ['Program', 'Project', 'Team'],
  defaults: {
    Program: ['g-core', 'g-exp'],
    Project: ['g-core', 't-sec'],
    Team: ['t-api', 't-data', 't-web', 't-design', 'g-legacy'],
  },
  plans: [
    { id: 1, name: 'Platform', level: 'Program', adoProject: 'Platform', areaPath: 'Platform',
      iteration: 'it-pi', workforce: null, archived: false, types: ['Epic'], closedHistoryDays: 0 },
    { id: 2, name: 'Core', level: 'Project', adoProject: 'Platform', areaPath: 'Platform\\Core',
      iteration: 'it-2w', workforce: null, archived: false, types: ['Feature'],
      closedHistoryDays: 90 },
    { id: 6, name: 'Campaigns', level: 'Project', adoProject: 'Marketing',
      areaPath: 'Marketing\\Campaigns', iteration: '', workforce: null, archived: false,
      types: ['Campaign'], closedHistoryDays: 0 },
    { id: 3, name: 'Checkout', level: 'Team', adoProject: 'Platform',
      areaPath: 'Platform\\Web\\Checkout', iteration: 'it-2w', workforce: ['t-web', 't-sec'],
      archived: false, types: ['Feature'], closedHistoryDays: 0 },
    { id: 5, name: 'Search', level: 'Team', adoProject: 'Platform',
      areaPath: 'Platform\\Web\\Search', iteration: 'it-2w', workforce: null, archived: false,
      types: ['Feature'], closedHistoryDays: 0,
      load: { status: 'stale', count: 0, since: 'yesterday 16:40' } },
    { id: 4, name: 'iOS', level: 'Team', adoProject: 'Mobile', areaPath: 'Mobile\\iOS',
      iteration: '', workforce: null, archived: true, types: ['Feature'], closedHistoryDays: 0 },
  ],
  search: '', levelFilter: '', openMenu: null, dragId: null,
  wfLevel: 'Program', wfSearch: '', newLevel: '',
  drawer: null,
};
let nextId = 7;

// ---------- Helpers ----------
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const recordById = (id) => GROUPS.find((g) => g.id === id) || TEAMS.find((t) => t.id === id);
const iterationName = (id) => {
  const found = ITERATION_SETS.find((it) => it.id === id);
  return found ? found.name : '';
};
const leaf = (path) => path.split('\\').pop();
const planUsingPath = (path, exceptId) =>
  state.plans.find((p) => p.areaPath === path && p.id !== exceptId);
const clone = (value) => JSON.parse(JSON.stringify(value));
const processById = (id) => state.processes.find((p) => p.id === id);
const processOf = (adoProject) => state.processes.find((p) => p.projects.includes(adoProject));
const typesOf = (pid) => state.typeLevels[pid].flat();
const processImported = (adoProject) => typesOf(processOf(adoProject).id).length > 0;
const historyLabel = (days) => HISTORY.find(([d]) => d === days)[1];
function conventionTypes(draft) {
  const proc = processOf(draft.adoProject);
  const siblings = state.plans.filter((p) => p.id !== draft.id && p.level === draft.level &&
    processOf(p.adoProject) === proc);
  return [...new Set(siblings.flatMap((p) => p.types))];
}

// Keep display order in step with the imported types of each process.
function syncDisplay() {
  state.processes.forEach((proc) => {
    const usable = proc.types.filter((t) => t.imported && !t.missing).map((t) => t.name);
    const levels = state.typeLevels[proc.id].map((l) => l.filter((n) => usable.includes(n)))
      .filter((l) => l.length);
    usable.forEach((n) => {
      if (levels.some((l) => l.includes(n))) return;
      const sibling = levels.find((l) => l.some((x) => BACKLOG[x] === BACKLOG[n]));
      if (sibling === undefined) levels.push([n]);
      else sibling.push(n);
    });
    state.typeLevels[proc.id] = levels;
    const count = levels.flat().length;
    const listed = state.processOrder.includes(proc.id);
    if (count && !listed) state.processOrder = [...state.processOrder, proc.id];
    if (!count && listed) state.processOrder = state.processOrder.filter((x) => x !== proc.id);
  });
}

function workforceSummary(plan) {
  if (plan.workforce === null) return `<span class="sub">Inherits ${esc(plan.level)} default</span>`;
  return `<span class="tag accent">Custom · ${plan.workforce.length}</span>`;
}

// ---------- Workforce tree (shared by defaults + plan editor) ----------
function renderChips(selected, action) {
  if (selected.length === 0) return '<div class="sub">Nothing selected — no one can be allocated.</div>';
  return `<div class="summary-chips">${selected.map((id) => {
    const r = recordById(id);
    const kind = GROUPS.includes(r) ? 'group' : 'team';
    return `<span class="chip ${r.archived ? 'archived' : ''}" title="${kind}">
      ${esc(r.name)}${r.archived ? ' · archived' : ''}
      <button data-action="${action}" data-id="${id}" aria-label="Remove ${esc(r.name)}">×</button>
    </span>`;
  }).join('')}</div>`;
}

function renderTree(selected, action, filter) {
  const q = filter.toLowerCase();
  // Archived records stay visible only while selected, so they can be cleared.
  const visible = (r) => (!r.archived || selected.includes(r.id)) &&
    (!q || r.name.toLowerCase().includes(q));
  const teamRow = (t) => `<div class="tree-row team">
      <label><input type="checkbox" data-action="${action}" data-id="${t.id}"
        ${selected.includes(t.id) ? 'checked' : ''}>
        <span class="grow">${esc(t.name)}</span>
        ${t.archived ? '<span class="tag warn">archived — uncheck to remove</span>' : ''}
      </label></div>`;
  const groups = GROUPS.map((g) => {
    const teams = TEAMS.filter((t) => t.group_id === g.id && visible(t));
    if (!visible(g) && teams.length === 0) return '';
    const groupSelectable = !g.archived || selected.includes(g.id);
    return `<div class="tree-group">
      <div class="tree-row group">
        ${groupSelectable ? `<label><input type="checkbox" data-action="${action}" data-id="${g.id}"
          ${selected.includes(g.id) ? 'checked' : ''}>
          <span class="grow">${esc(g.name)} <span class="sub">(whole group)</span></span></label>`
          : `<span class="grow">${esc(g.name)}</span>`}
        ${g.archived ? '<span class="tag warn">archived</span>' : ''}
      </div>
      ${teams.map(teamRow).join('')}
    </div>`;
  }).join('');
  const ungrouped = TEAMS.filter((t) => t.group_id === null && visible(t));
  const loose = ungrouped.length ? `<div class="tree-group">
      <div class="tree-row group"><span class="grow sub">Teams without a group</span></div>
      ${ungrouped.map(teamRow).join('')}</div>` : '';
  return `<div class="tree">${groups}${loose}</div>`;
}

function toggleId(list, id) {
  return list.includes(id) ? list.filter((x) => x !== id) : [...list, id];
}

// ---------- Sub navigation ----------
function renderSubnav() {
  const active = state.plans.filter((p) => !p.archived).length;
  const item = (view, label, extra) => `<button class="${state.view === view ? 'active' : ''}"
    data-action="view" data-view="${view}"><span>${label}</span>${extra}</button>`;
  $('#subnav').innerHTML = `
    ${item('plans', 'Plans', `<span class="count">${active}</span>`)}
    <hr>
    <div class="hint">Setup — usually done once</div>
    ${item('levels', 'Plan levels', `<span class="count">${state.levels.length}</span>`)}

}

// ---------- Plans view ----------
const ARCHIVED = '__archived';

function renderPlans() {
  const q = state.search.toLowerCase();
  const archivedCount = state.plans.filter((p) => p.archived).length;
  if (state.levelFilter === ARCHIVED && archivedCount === 0) state.levelFilter = '';
  const archivedView = state.levelFilter === ARCHIVED;
  const matches = (p) => p.archived === archivedView &&
    (archivedView || !state.levelFilter || p.level === state.levelFilter) &&
    (!q || p.name.toLowerCase().includes(q) || p.areaPath.toLowerCase().includes(q));
  const blocks = state.levels.map((level) => {
    const plans = state.plans.filter((p) => p.level === level && matches(p));
    if (plans.length === 0 && (state.levelFilter || q)) return '';
    return `<div class="level-block">
      <div class="level-head"><span>${esc(level)}</span><span>· ${plans.length}</span></div>
      <div class="plan-list">${plans.length
        ? plans.map((p, i) => renderPlanRow(p, i, plans.length, !archivedView)).join('')
        : `<div class="empty">No ${esc(level.toLowerCase())} plans yet.</div>`}</div>
    </div>`;
  }).join('');
  return `
    <h1>Plans</h1>
    <p class="lead">Each plan shows the work items from one Azure DevOps area path.</p>
    <div class="note">Plans are grouped by level. Drag ☰ (or use ⋯ → Move up/down) to set the
      order planners see them in within their level. Archived plans are a filter choice that only
      appears when archived plans exist.</div>
    <div class="toolbar">
      <input type="search" placeholder="Search name or area path" value="${esc(state.search)}"
        data-input="search">
      <select data-input="levelFilter">
        <option value="">All levels</option>
        ${state.levels.map((l) => `<option ${state.levelFilter === l ? 'selected' : ''}>${esc(l)}</option>`).join('')}
        ${archivedCount ? `<option disabled>──────────</option>
          <option value="${ARCHIVED}" ${archivedView ? 'selected' : ''}>Archived plans (${archivedCount})</option>` : ''}
      </select>
      <span class="spacer"></span>
      <button class="btn primary" data-action="new-plan">+ New plan</button>
    </div>
    <div class="note">Removed from this screen: fetch states, display states, free-text work item
      types, metadata prefetch/colour chips, raw JSON (moves to admin-only diagnostics) and the
      separate "Browse Azure DevOps" panel (now step 1 of New plan). Work item types are picked
      per plan from the types imported on the Azure DevOps screen.</div>
    ${blocks}
  `;
}

function renderPlanRow(p, index, count, orderable) {
  const menuOpen = state.openMenu === p.id;
  return `<div class="plan-row ${p.archived ? 'archived' : ''}" data-plan-id="${p.id}"
    ${orderable ? 'draggable="true"' : ''}>
    <div class="handle" title="${orderable ? 'Drag to reorder' : ''}">${orderable ? '☰' : ''}</div>
    <div><div class="plan-name">${esc(p.name)}</div>
      <div class="sub">${esc(p.types.join(', '))}${p.closedHistoryDays
        ? ` · ${esc(historyLabel(p.closedHistoryDays))} history` : ''}</div>
      ${processImported(p.adoProject) ? '' : '<span class="tag warn">Process not imported</span>'}
      ${p.archived ? '<span class="tag warn">Archived</span>' : ''}</div>
    <div><div class="sub">${esc(p.adoProject)}</div><div class="path" title="${esc(p.areaPath)}">
      ${esc(p.areaPath)}</div></div>
    <div>${p.iteration ? esc(iterationName(p.iteration)) : '<span class="sub">No iterations</span>'}</div>
    <div>${workforceSummary(p)}${renderLoadStatus(p)}</div>
    <div style="display:flex;gap:4px">
      <button class="btn" data-action="edit-plan" data-id="${p.id}">Edit</button>
      <span class="menu"><button class="btn" data-action="menu" data-id="${p.id}"
        aria-label="More actions">⋯</button>
        ${menuOpen ? `<div class="menu-pop">
          ${orderable ? `<button data-action="move" data-id="${p.id}" data-dir="-1"
            ${index === 0 ? 'disabled' : ''}>Move up</button>
          <button data-action="move" data-id="${p.id}" data-dir="1"
            ${index === count - 1 ? 'disabled' : ''}>Move down</button>` : ''}
          <button data-action="archive" data-id="${p.id}">${p.archived ? 'Restore' : 'Archive'}</button>
          <button class="danger" data-action="delete" data-id="${p.id}">Delete…</button>
        </div>` : ''}</span>
    </div>
  </div>`;
}

function renderLoadStatus(p) {
  if (p.load === undefined) return '';
  if (p.load.status === 'loading') return '<div class="sub">Loading work items…</div>';
  if (p.load.status === 'ok') return `<div class="sub">Loaded ${p.load.count} items just now</div>`;
  const label = p.load.status === 'stale' ? `Stale since ${esc(p.load.since)}` : 'Data not loaded';
  return `<div><span class="tag warn" title="The last refresh could not read this area path
    with the refreshing user's access; cached data was kept.">${label}</span>
    <button class="btn link" data-action="retry" data-id="${p.id}">Retry</button></div>`;
}

// Simulates POST /admin/v1/projects/{id}/refresh; paths ending in "Events" are unreadable for the demo.
function loadPlan(id) {
  const plan = state.plans.find((p) => p.id === id);
  plan.load = { status: 'loading', count: 0 };
  setTimeout(() => {
    plan.load = plan.areaPath.endsWith('Events') ? { status: 'denied', count: 0 }
      : { status: 'ok', count: 40 + plan.areaPath.length * 3 };
    render();
  }, 900);
}

// ---------- Plan levels view ----------
function renderLevels() {
  const rows = state.levels.map((level, i) => {
    const used = state.plans.filter((p) => p.level === level).length;
    const removeReason = state.levels.length === 1 ? 'At least one level is required'
      : used ? `Used by ${used} plan${used === 1 ? '' : 's'}` : '';

      <div class="level-item">
        <span class="rank">${i + 1}</span>
        <div class="grow"><strong>${esc(level)}</strong>
          <div class="sub">${used} plan${used === 1 ? '' : 's'}${i === 0 ? ' · broadest'
            : i === state.levels.length - 1 ? ' · most detailed' : ''}</div></div>
        <button class="btn" data-action="level-up" data-index="${i}" ${i === 0 ? 'disabled' : ''}
          aria-label="Move ${esc(level)} up">↑</button>
        <button class="btn" data-action="level-down" data-index="${i}"
          ${i === state.levels.length - 1 ? 'disabled' : ''} aria-label="Move ${esc(level)} down">↓</button>
        <button class="btn danger" data-action="level-remove" data-index="${i}"

      shows why on hover instead of failing after the click.</div>
    <div class="levels">${rows}</div>
    <div class="level-add">
      <input type="text" placeholder="New level name, e.g. Portfolio" value="${esc(state.newLevel)}"
        data-input="newLevel">
      <button class="btn" data-action="level-add">Add level</button>
    </div>

}

// ---------- Default workforce view ----------
function renderWorkforce() {
  const level = state.wfLevel;
  const selected = state.defaults[level];
  const overrides = state.plans.filter((p) => p.level === level && p.workforce !== null).length;

// ---------- Azure DevOps view ----------
function plansUsingType(proc, name) {
  return state.plans.filter((p) => proc.projects.includes(p.adoProject) && p.types.includes(name));
}

function renderTypeRow(proc, t) {
  const users = plansUsingType(proc, t.name);
  const taskLevel = t.level === 'task';
  const locked = taskLevel || (t.missing && !t.imported);
  return `<tr class="${taskLevel ? 'disabled' : ''}">
    <td><input type="checkbox" data-action="ado-import" data-pid="${proc.id}"
      data-type="${esc(t.name)}" ${t.imported ? 'checked' : ''} ${locked ? 'disabled' : ''}
      title="${taskLevel ? 'Task-level types cannot be imported' : ''}"></td>
    <td><strong>${esc(t.name)}</strong>
      ${t.missing ? '<div><span class="tag warn">missing in ADO — uncheck to remove</span></div>' : ''}</td>
    <td>${esc(t.level)}${taskLevel ? '<div class="sub">not importable</div>' : ''}</td>
    <td>${t.states.map((st) => `<span class="st ${st.cat}" title="${st.cat}">${esc(st.name)}</span>`).join('')}</td>
    <td>${users.length ? esc(users.map((p) => p.name).join(', ')) : '<span class="sub">—</span>'}</td>
  </tr>`;
}

function renderAdo() {
  if (state.adoDraft === null) state.adoDraft = clone(state.processes);
  const dirty = JSON.stringify(state.adoDraft) !== JSON.stringify(state.processes);
  const cards = state.adoDraft.map((proc) => {
    const open = state.adoOpen.includes(proc.id);
    const importable = proc.types.filter((t) => t.level !== 'task' && !t.missing).length;
    const imported = proc.types.filter((t) => t.imported && !t.missing).length;
    const plans = state.plans.filter((p) => proc.projects.includes(p.adoProject)).length;
    return `<div class="proc-card">
      <div class="proc-head">
        <button class="icon" data-action="ado-toggle" data-pid="${proc.id}"
          aria-label="Toggle ${esc(proc.name)}">${open ? '▾' : '▸'}</button>
        <div class="grow"><strong>${esc(proc.name)}</strong>
          <span class="sub">inherits from ${esc(proc.parent)}</span>
          <div class="sub">ADO projects: ${esc(proc.projects.join(', '))} · ${plans}
            plan${plans === 1 ? '' : 's'}</div></div>
        <span class="tag ${imported ? 'accent' : 'warn'}">${imported} of ${importable} types imported</span>
      </div>
      ${open ? `<table class="types"><thead><tr><th>Import</th><th>Type</th><th>Backlog level</th>
        <th>States (ADO order)</th><th>Used by plans</th></tr></thead>
        <tbody>${proc.types.map((t) => renderTypeRow(proc, t)).join('')}</tbody></table>` : ''}
    </div>`;
  }).join('');
  return `
    <h1>Azure DevOps Processes</h1>
    <p class="lead">Processes, work item types and states loaded from Azure DevOps. Only imported
      types are fetched and followed when discovering linked work.</p>
    <div class="note">Loaded with the signed-in user's PAT through the ADO process API. Task-level
      types are listed but cannot be imported. Types that disappeared from ADO stay flagged until
      un-imported. Un-importing a type that a plan uses is blocked on save.</div>
    <div class="toolbar">
      <span class="sub">https://dev.azure.com/contoso · loaded ${esc(state.adoLoadedAt)}</span>
      <span class="spacer"></span>
      <button class="btn" data-action="ado-reload">⟳ Reload from Azure DevOps</button>
      <button class="btn" data-action="ado-discard" ${dirty ? '' : 'disabled'}>Discard</button>
      <button class="btn primary" data-action="ado-save" ${dirty ? '' : 'disabled'}>Save</button>
    </div>
    ${state.adoError ? `<div class="callout">${esc(state.adoError)}</div>` : ''}
    ${cards}
  `;
}

// ---------- Global settings view ----------
function stateColumns(proc) {
  const columns = [];
  typesOf(proc.id).forEach((name) => {
    const t = proc.types.find((x) => x.name === name);
    const signature = t.states.map((st) => st.name).join('|');
    let column = columns.find((c) => c.signature === signature);
    if (column === undefined) {
      column = { signature, states: t.states, types: [] };
      columns.push(column);
    }
    column.types.push(name);
  });
  return columns;
}

function renderGlobal() {
  const cards = state.processOrder.map((pid, i) => {
    const proc = processById(pid);
    const levels = state.typeLevels[pid];
    const hierarchy = levels.map((level, li) => `<div class="level-row">
      <span class="level-label">Tier ${li + 1}${li ? ` <span class="sub">child of tier ${li}</span>` : ''}</span>
      ${level.map((name) => {
        const alone = level.length === 1;
        return `<span class="type-chip">${esc(name)}
          <button class="icon" data-action="type-move" data-pid="${pid}" data-type="${esc(name)}"
            data-dir="-1" ${li === 0 && alone ? 'disabled' : ''}
            aria-label="Move ${esc(name)} up a tier">↑</button>
          <button class="icon" data-action="type-move" data-pid="${pid}" data-type="${esc(name)}"
            data-dir="1" ${li === levels.length - 1 && alone ? 'disabled' : ''}
            aria-label="Move ${esc(name)} down a tier">↓</button></span>`;
      }).join('')}
      ${level.length > 1 ? '<span class="sub">siblings</span>' : ''}
    </div>`).join('');
    const columns = stateColumns(proc).map((col) => `<div class="column">
      <div class="type-line"><span class="grow">${esc(col.types.join(', '))}</span></div>
      <div class="states">${col.states.filter((st) => st.cat !== 'Removed').map((st) =>
        `<span class="st ${st.cat}" title="${st.cat}">${esc(st.name)}</span>`).join(' → ')}</div>
    </div>`).join('');
    return `<div class="proc-card">
      <div class="proc-head">
        <span class="rank" style="font-weight:600">${i + 1}</span>
        <div class="grow"><strong>${esc(proc.name)}</strong>
          <div class="sub">${typesOf(pid).length} imported types · ${esc(proc.projects.join(', '))}</div></div>
        <button class="btn" data-action="proc-move" data-index="${i}" data-dir="-1"
          ${i === 0 ? 'disabled' : ''} aria-label="Move ${esc(proc.name)} up">↑</button>
        <button class="btn" data-action="proc-move" data-index="${i}" data-dir="1"
          ${i === state.processOrder.length - 1 ? 'disabled' : ''}
          aria-label="Move ${esc(proc.name)} down">↓</button>
      </div>
      <div class="hierarchy"><div class="sub-title">Hierarchy (parent → child)</div>${hierarchy}</div>
      <div class="sub-title" style="padding:0 14px">State sequences</div>
      <div class="columns">${columns}</div>
    </div>`;
  }).join('');
  const preview = state.processOrder.map((pid) => `<div class="grp">${esc(processById(pid).name)}</div>
    ${state.typeLevels[pid].map((level, li) => level.map((name) =>
      `<label style="padding-left:${li * 14}px"><input type="checkbox" checked disabled>
        ${esc(name)}</label>`).join('')).join('')}`).join('');
  return `
    <h1>Global Project Settings</h1>
    <p class="lead">Work item type hierarchy and state sequence, built from the types imported on
      the Azure DevOps screen.</p>
    <div class="note">Replaces the pool discovered from the first plan's tasks. Each process is a
      card. The hierarchy is a set of type tiers: each tier is the parent of the next, and types in
      one tier are siblings (User Story and Bug are both children of Feature, not of each
      other). ↑/↓ moves a type to the adjacent tier, or to a new tier at either end. Initial
      tiers follow the ADO backlogs. State-sequence columns group types that share the same
      states, in ADO order (category coloured, Removed hidden). Process order decides the order
      everywhere in the UI: all Agile types first, then Marketing, never mixed. See the Sidebar
      preview.</div>
    <div class="global-grid">
      <div>${cards || '<div class="empty">Import work item types on the Azure DevOps screen first.</div>'}
        <div class="toolbar"><span class="spacer"></span>
          <button class="btn primary">Save</button></div></div>
      <aside class="sidebar-preview"><strong>Sidebar preview · Types</strong>${preview}</aside>
    </div>
  `;
}

// ---------- Drawer: new / edit plan ----------
const STEPS = ['Area path', 'Details', 'Workforce', 'Review'];

function openNewPlan() {
  state.drawer = { mode: 'new', step: 0, areaSearch: '', wfSearch: '',
    draft: { id: null, name: '', level: state.levels[state.levels.length - 1],
      adoProject: Object.keys(ADO)[0], areaPath: '', iteration: '', workforce: null,
      archived: false, types: [], closedHistoryDays: 0 } };
}

function openEditPlan(id) {
  const plan = state.plans.find((p) => p.id === id);
  state.drawer = { mode: 'edit', step: null, areaSearch: '', wfSearch: '', changeArea: false,
    draft: JSON.parse(JSON.stringify(plan)) };

function renderAreaPicker(d) {
  const draft = d.draft;

  const rows = ADO[draft.adoProject]
    .filter((path) => !q || path.toLowerCase().includes(q))
    .map((path) => {
      const depth = path.split('\\').length - 1;

      </div>`;
    }).join('');
  return `
    <div class="field"><label>Azure DevOps project</label>
      <select data-draft="adoProject">${Object.keys(ADO).map((p) =>
        `<option ${p === draft.adoProject ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>

        below them, become part of the plan.</div></div>

    <div class="field"><label for="plan-iter">Iterations</label>
      <select id="plan-iter" data-draft="iteration"><option value="">No iterations</option>
        ${ITERATION_SETS.map((it) => `<option value="${it.id}"
          ${draft.iteration === it.id ? 'selected' : ''}>${esc(it.name)}</option>`).join('')}
      </select>
      <div class="help">Optional. Sets the iteration lines shown on the timeline.</div></div>`;
}

function renderPlanWorkforce(d) {
  const draft = d.draft;
  const inherit = draft.workforce === null;
  const defaults = state.defaults[draft.level];
  return `
    <div class="field"><span class="label">Who can be allocated to this plan?</span>
      <div class="choice-cards">
        <label class="${inherit ? 'selected' : ''}"><input type="radio" name="wf"
          data-action="wf-mode" value="inherit" ${inherit ? 'checked' : ''}>
          <span><strong>Use ${esc(draft.level)} default</strong>
          <div class="sub">${defaults.length} teams/groups · follows future changes</div></span></label>
        <label class="${inherit ? '' : 'selected'}"><input type="radio" name="wf"
          data-action="wf-mode" value="custom" ${inherit ? '' : 'checked'}>
          <span><strong>Choose for this plan</strong>
          <div class="sub">Fixed list, ignores the default</div></span></label>
      </div></div>
    ${inherit ? `<div class="sub" style="margin-bottom:6px">Current ${esc(draft.level)} default:</div>
      <div class="summary-chips">${defaults.map((id) =>
        `<span class="tag">${esc(recordById(id).name)}</span>`).join('')}</div>`
    : `${renderChips(draft.workforce, 'plan-wf-toggle')}
      <input class="tree-search" type="search" placeholder="Filter teams and groups"
        value="${esc(d.wfSearch)}" data-drawer-input="wfSearch">
      ${renderTree(draft.workforce, 'plan-wf-toggle', d.wfSearch)}`}`;
}

function renderReview(draft) {
  return `<dl class="review">
    <dt>Name</dt><dd>${esc(draft.name)}</dd>
    <dt>Level</dt><dd>${esc(draft.level)}</dd>
    <dt>Area path</dt><dd class="path">${esc(draft.areaPath)}</dd>
    <dt>Process · work item types</dt><dd>${esc(processOf(draft.adoProject).name)} ·
      ${esc(draft.types.join(', '))}</dd>
    <dt>Closed work history</dt><dd>${esc(historyLabel(draft.closedHistoryDays))}</dd>
    <dt>Iterations</dt><dd>${draft.iteration ? esc(iterationName(draft.iteration)) : 'None'}</dd>
    <dt>Workforce</dt><dd>${workforceSummary(draft)}</dd>
  </dl>
  <div class="note">Nothing is saved until "Create plan". The plan is then saved and its work items
    are loaded right away, so planners can use it immediately.</div>`;
}

function stepValid(d) {
  if (d.step === 0) return d.draft.areaPath !== '' && processImported(d.draft.adoProject);
  if (d.step === 1) return d.draft.name.trim() !== '' && d.draft.types.length > 0;
  return true;
}

function renderDrawer() {
  const d = state.drawer;
  $('#scrim').classList.toggle('open', d !== null);
  $('#drawer').classList.toggle('open', d !== null);
  if (d === null) { $('#drawer').innerHTML = ''; return; }
  if (d.mode === 'loading') {
    const plan = state.plans.find((p) => p.id === d.planId);
    const status = plan.load.status;
    $('#drawer').innerHTML = `
      <header><h2>${esc(plan.name)} saved</h2></header>
      <div class="body">
        ${status === 'loading' ? '<p>Loading work items from Azure DevOps…</p>'
          : status === 'ok' ? `<p>✓ Loaded ${plan.load.count} work items. Planners can use this plan
            now.</p>`
          : `<div class="callout">The plan is saved, but your Azure DevOps access cannot read this
            area path (or an item linked to it). Nothing was cached. Someone with access can load
            it, or retry once your access is fixed.</div>`}
        <div class="note">Save and load are separate steps. The plan is stored first, then
          POST /admin/v1/projects/{id}/refresh loads only this plan with the admin's PAT. A refresh
          is all-or-nothing: any 401/403 aborts it and keeps the previous (expired) data.</div>
      </div>
      <footer>${status === 'denied'
        ? `<button class="btn" data-action="retry" data-id="${plan.id}">Retry</button>` : ''}
        <span class="spacer"></span>
        <button class="btn primary" data-action="close" ${status === 'loading' ? 'disabled' : ''}>Close</button>
      </footer>`;
    return;
  }
  if (d.mode === 'new') {
    const body = [renderAreaPicker, () => renderDetails(d.draft), renderPlanWorkforce,
      () => renderReview(d.draft)][d.step](d);
    $('#drawer').innerHTML = `
      <header><h2>New plan</h2>
        <div class="steps">${STEPS.map((s, i) => `<span class="${i === d.step ? 'active'
          : i < d.step ? 'done' : ''}">${i < d.step ? '✓ ' : `${i + 1}. `}${s}</span>`).join('')}</div>
      </header>
      <div class="body">${body}</div>
      <footer>
        <button class="btn" data-action="close">Cancel</button><span class="spacer"></span>
        ${d.step > 0 ? '<button class="btn" data-action="back">Back</button>' : ''}
        ${d.step < STEPS.length - 1
          ? `<button class="btn primary" data-action="next" ${stepValid(d) ? '' : 'disabled'}>Next</button>`
          : '<button class="btn primary" data-action="create">Create plan</button>'}
      </footer>`;
    return;
  }
  const original = state.plans.find((p) => p.id === d.draft.id);
  $('#drawer').innerHTML = `
    <header><h2>Edit ${esc(original.name)}</h2>
      <div class="sub">Changes apply when you press Save.</div></header>
    <div class="body">
      <div class="section-title">Details</div>
      ${renderDetails(d.draft)}
      <div class="section-title">Area path</div>
      ${d.changeArea ? `<div class="callout">Changing the area path replaces every work item in
          this plan. Scenarios that reference the old items will show them as missing.</div>
          ${renderAreaPicker(d)}`
        : `<div class="field"><div class="sub">${esc(d.draft.adoProject)}</div>
          <div class="path">${esc(d.draft.areaPath)}</div>
          <button class="btn link" data-action="change-area">Change area path…</button></div>`}
      <div class="section-title">Workforce</div>
      ${renderPlanWorkforce(d)}
      <div class="section-title">Danger zone</div>
      <div style="display:flex;gap:8px">
        <button class="btn" data-action="archive" data-id="${d.draft.id}">
          ${original.archived ? 'Restore plan' : 'Archive plan'}</button>
        <button class="btn danger" data-action="delete" data-id="${d.draft.id}">Delete plan…</button>
      </div>
      <div class="help sub" style="margin-top:6px">Archived plans are hidden from planners but keep
        their configuration.</div>
    </div>
    <footer><button class="btn" data-action="close">Cancel</button><span class="spacer"></span>
      <button class="btn primary" data-action="save"
        ${d.draft.name.trim() && d.draft.types.length ? '' : 'disabled'}>Save</button>
    </footer>`;
}

// ---------- Render + events ----------
const PAGES = [['plans', 'Plans'], ['ado', 'Azure DevOps Processes'],
  ['global', 'Global Project Settings']];

function render() {
  $('#topnav').innerHTML = `<span>Users</span><span>Workforce</span><span>Iterations</span>
    ${PAGES.map(([page, label]) => `<button class="${state.page === page ? 'active' : ''}"
      data-action="page" data-page="${page}">${label}</button>`).join('')}`;
  $('.layout').classList.toggle('full', state.page !== 'plans');
  renderSubnav();
  if (state.page === 'ado') $('#view').innerHTML = renderAdo();
  else if (state.page === 'global') $('#view').innerHTML = renderGlobal();
  else $('#view').innerHTML = state.view === 'plans' ? renderPlans()
    : state.view === 'levels' ? renderLevels() : renderWorkforce();
  renderDrawer();
}

// Plans are ordered by their position in the flat list; only same-level neighbours matter.
function movePlan(dragId, targetId) {
  const plans = [...state.plans];
  const from = plans.findIndex((p) => p.id === dragId);
  const to = plans.findIndex((p) => p.id === targetId);
  const [item] = plans.splice(from, 1);
  plans.splice(to, 0, item);
  state.plans = plans;
}

function swapLevels(i, j) {
  const levels = [...state.levels];
  [levels[i], levels[j]] = [levels[j], levels[i]];
  state.levels = levels;
}

const ACTIONS = {
  page: (el) => { state.page = el.dataset.page; },
  'goto-ado': () => { state.drawer = null; state.page = 'ado'; },
  'ado-toggle': (el) => { state.adoOpen = toggleId(state.adoOpen, el.dataset.pid); },
  'ado-import': (el) => {
    const t = state.adoDraft.find((p) => p.id === el.dataset.pid).types
      .find((x) => x.name === el.dataset.type);
    t.imported = el.checked;
  },
  'ado-reload': () => { state.adoLoadedAt = 'just now'; },
  'ado-discard': () => { state.adoDraft = null; state.adoError = ''; },
  'ado-save': () => {
    const problems = [];
    state.plans.forEach((plan) => {
      const proc = state.adoDraft.find((p) => p.projects.includes(plan.adoProject));
      plan.types.forEach((name) => {
        if (!proc.types.find((t) => t.name === name).imported) {
          problems.push(`${name} is used by plan "${plan.name}"`);
        }
      });
    });
    if (problems.length) {
      state.adoError = `Not saved: ${problems.join('; ')}. Change those plans first.`;
      return;
    }
    state.processes = state.adoDraft;
    state.adoDraft = null;
    state.adoError = '';
    syncDisplay();
  },
  'proc-move': (el) => {
    const i = Number(el.dataset.index);
    const j = i + Number(el.dataset.dir);
    const order = [...state.processOrder];
    [order[i], order[j]] = [order[j], order[i]];
    state.processOrder = order;
  },
  'type-move': (el) => {
    const levels = state.typeLevels[el.dataset.pid].map((l) => [...l]);
    const name = el.dataset.type;
    const i = levels.findIndex((l) => l.includes(name));
    const j = i + Number(el.dataset.dir);
    levels[i] = levels[i].filter((n) => n !== name);
    if (j < 0) levels.unshift([name]);
    else if (j >= levels.length) levels.push([name]);
    else levels[j].push(name);
    state.typeLevels[el.dataset.pid] = levels.filter((l) => l.length);
  },
  'plan-type': (el) => {
    state.drawer.draft.types = toggleId(state.drawer.draft.types, el.dataset.type);
  },
  view: (el) => { state.view = el.dataset.view; },
  'new-plan': () => openNewPlan(),
  'edit-plan': (el) => { state.openMenu = null; openEditPlan(Number(el.dataset.id)); },
  move: (el) => {
    const plan = state.plans.find((p) => p.id === Number(el.dataset.id));
    const siblings = state.plans.filter((p) => p.level === plan.level && !p.archived);
    const neighbour = siblings[siblings.indexOf(plan) + Number(el.dataset.dir)];
    movePlan(plan.id, neighbour.id);
  },
  menu: (el) => {
    const id = Number(el.dataset.id);
    state.openMenu = state.openMenu === id ? null : id;
  },
  archive: (el) => {
    const plan = state.plans.find((p) => p.id === Number(el.dataset.id));
    plan.archived = !plan.archived;
    state.openMenu = null;
    state.drawer = null;
    if (!plan.archived) loadPlan(plan.id);
  },
  retry: (el) => { loadPlan(Number(el.dataset.id)); },
  delete: (el) => {
    const plan = state.plans.find((p) => p.id === Number(el.dataset.id));
    if (!confirm(`Delete "${plan.name}"? Archive instead if you may need it again.`)) return;
    state.plans = state.plans.filter((p) => p !== plan);
    state.openMenu = null;
    state.drawer = null;
  },
  'level-up': (el) => swapLevels(Number(el.dataset.index), Number(el.dataset.index) - 1),
  'level-down': (el) => swapLevels(Number(el.dataset.index), Number(el.dataset.index) + 1),
  'level-remove': (el) => {
    const level = state.levels[Number(el.dataset.index)];
    state.levels = state.levels.filter((l) => l !== level);
    delete state.defaults[level];
    if (state.wfLevel === level) state.wfLevel = state.levels[0];
  },
  'level-add': () => {
    const name = state.newLevel.trim();
    if (!name || state.levels.some((l) => l.toLowerCase() === name.toLowerCase())) return;
    state.levels = [...state.levels, name];
    state.defaults[name] = [];
    state.newLevel = '';
  },
  'wf-level': (el) => { state.wfLevel = el.dataset.level; },
  'wf-toggle': (el) => {
    state.defaults[state.wfLevel] = toggleId(state.defaults[state.wfLevel], el.dataset.id);
  },
  'plan-wf-toggle': (el) => {
    state.drawer.draft.workforce = toggleId(state.drawer.draft.workforce, el.dataset.id);
  },
  'wf-mode': (el) => {
    const draft = state.drawer.draft;
    draft.workforce = el.value === 'inherit' ? null : [...state.defaults[draft.level]];
  },
  'pick-area': (el) => {
    const draft = state.drawer.draft;
    const previousLeaf = draft.areaPath ? leaf(draft.areaPath) : '';
    draft.areaPath = el.dataset.path;
    if (draft.name === '' || draft.name === previousLeaf) draft.name = leaf(draft.areaPath);
  },
  'change-area': () => { state.drawer.changeArea = true; },
  close: () => { state.drawer = null; },
  back: () => { state.drawer.step -= 1; },
  next: () => {
    const draft = state.drawer.draft;
    if (state.drawer.step === 0 && draft.types.length === 0) draft.types = conventionTypes(draft);
    state.drawer.step += 1;
  },
  create: () => {
    const plan = { ...state.drawer.draft, id: nextId++ };
    state.plans = [...state.plans, plan];
    state.view = 'plans';
    state.drawer = { mode: 'loading', planId: plan.id };
    loadPlan(plan.id);
  },
  save: () => {
    const draft = state.drawer.draft;
    const original = state.plans.find((p) => p.id === draft.id);
    const reload = ['areaPath', 'types', 'closedHistoryDays'].some((key) =>
      JSON.stringify(original[key]) !== JSON.stringify(draft[key]));
    state.plans = state.plans.map((p) => p.id === draft.id ? draft : p);
    state.drawer = reload ? { mode: 'loading', planId: draft.id } : null;
    if (reload) loadPlan(draft.id);
  },
};

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-action]');
  if (!el || el.disabled) return;
  if (el.type === 'checkbox' || el.type === 'radio') return;
  if (el === $('#scrim')) return;
  ACTIONS[el.dataset.action](el);
  render();
});

document.addEventListener('change', (event) => {
  const el = event.target;
  if (el.dataset.action && (el.type === 'checkbox' || el.type === 'radio')) {
    ACTIONS[el.dataset.action](el);
  } else if (el.dataset.draft) {
    const key = el.dataset.draft;
    state.drawer.draft[key] = key === 'closedHistoryDays' ? Number(el.value) : el.value;
    if (key === 'adoProject') {
      state.drawer.draft.areaPath = '';
      state.drawer.draft.types = [];
    }
  } else if (el.dataset.input === 'levelFilter') {
    state.levelFilter = el.value;
  } else {
    return;
  }
  render();
});

// Re-render on typing but keep focus/caret in the active input.
document.addEventListener('input', (event) => {
  const el = event.target;
  const key = el.dataset.input || el.dataset.drawerInput || (el.type === 'text' && el.dataset.draft);
  if (!key || el.dataset.input === 'levelFilter') return;
  if (el.dataset.input) state[key] = el.value;
  else if (el.dataset.drawerInput) state.drawer[key] = el.value;
  else state.drawer.draft[key] = el.value;
  const selector = el.dataset.input ? `[data-input="${key}"]`
    : el.dataset.drawerInput ? `[data-drawer-input="${key}"]` : `[data-draft="${key}"]`;
  const caret = el.selectionStart;
  render();
  const again = document.querySelector(selector);
  again.focus();
  again.setSelectionRange(caret, caret);
});

const rowOf = (event) => event.target.closest('.plan-row[draggable]');
const sameLevel = (a, b) => state.plans.find((p) => p.id === a).level ===
  state.plans.find((p) => p.id === b).level;
document.addEventListener('dragstart', (event) => {
  const row = rowOf(event);
  if (!row) return;
  state.dragId = Number(row.dataset.planId);
  row.classList.add('dragging');
});
document.addEventListener('dragover', (event) => {
  const row = rowOf(event);
  if (!row || !sameLevel(state.dragId, Number(row.dataset.planId))) return;
  event.preventDefault();
  document.querySelectorAll('.drop-target').forEach((r) => r.classList.remove('drop-target'));
  row.classList.add('drop-target');
});
document.addEventListener('drop', (event) => {
  const row = rowOf(event);
  if (!row) return;
  event.preventDefault();
  movePlan(state.dragId, Number(row.dataset.planId));
});
document.addEventListener('dragend', () => { state.dragId = null; render(); });

$('#scrim').addEventListener('click', () => { state.drawer = null; render(); });
$('#toggle-notes').addEventListener('change', (e) => {
  document.body.classList.toggle('notes', e.target.checked);
});

render();
</script>
</body>
</html>
