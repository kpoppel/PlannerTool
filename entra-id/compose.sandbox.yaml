name: planner-auth-sandbox

services:
  auth-standalone:
    build: .
    environment:
      ENTRA_AUTH_MODE: mock
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set synthetic tenant GUID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?Set synthetic client GUID}
      ADO_ORGANIZATION: ${ADO_ORGANIZATION:?Set synthetic organization}
      ENTRA_REDIRECT_URI: http://localhost:${SANDBOX_PORT:?Set loopback browser port}/auth/callback
      ENTRA_CLIENT_SECRET_FILE: /run/secrets/entra-secret
      ENTRA_LISTEN_HOST: 0.0.0.0
      ENTRA_LISTEN_PORT: '8000'
      ENTRA_NETWORK: private-compose
      ENTRA_INTERNAL_HOST: auth-standalone
      ENTRA_ADO_TRANSPORT: fixture
      ENTRA_BROKER_PUBLIC_URL: http://localhost:${SANDBOX_PORT}/auth/
      ENTRA_BROKER_KEY_FILE: /run/secrets/broker-key
      ENTRA_BROKER_REGISTRY_FILE: /app/config/instances.json
      ENTRA_BROKER_STORE: /app/state/protected/broker-v2-mock.sqlite
    secrets:
      - source: entra-secret
        target: entra-secret
      - source: broker-key
        target: broker-key
      - source: client-alpha
        target: client-alpha
    volumes:
      - ${SANDBOX_REGISTRY_FILE:?Set registry JSON file}:/app/config/instances.json:ro
      - auth-state:/app/state
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://auth-standalone:8000/auth/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - 127.0.0.1:${SANDBOX_PORT}:80
    volumes:
      - ./Caddyfile.sandbox:/etc/caddy/Caddyfile:ro
    networks: [default, ingress]
    depends_on: [auth-standalone]

secrets:
  entra-secret:
    file: ${SANDBOX_ENTRA_SECRET_FILE:?Set synthetic registration secret file}
  broker-key:
    file: ${SANDBOX_KEY_FILE:?Set broker Fernet key file}
  client-alpha:
    file: ${SANDBOX_INSTANCE_SECRET_FILE:?Set per-instance service secret file}

volumes:
  auth-state:

networks:
  default:
    internal: true
  ingress: