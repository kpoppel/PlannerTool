name: entra-id-poc

services:
  entra-id:
    build: .
    environment:
      ENTRA_AUTH_MODE: ${ENTRA_AUTH_MODE:-entra}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in .env}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?Set ENTRA_CLIENT_ID in .env}
      ADO_ORGANIZATION: ${ADO_ORGANIZATION:?Set ADO_ORGANIZATION in .env}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:?Set exact central callback URL}
      ENTRA_CLIENT_SECRET_FILE: /run/secrets/entra_client_secret
      ENTRA_LISTEN_HOST: 0.0.0.0
      ENTRA_LISTEN_PORT: '8000'
    secrets:
      - entra_client_secret
    ports:
      - 127.0.0.1:${POC_BACKEND_PORT:-8767}:8000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    environment:
      POC_HOSTNAME: ${POC_HOSTNAME:?Set POC_HOSTNAME in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./${CADDY_CONFIG:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./certificates:/certificates:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - entra-id
    restart: unless-stopped

secrets:
  entra_client_secret:
    file: ./entra-client-secret

networks:
  default:
    name: entra-id-poc

volumes:
  caddy_data:
  caddy_config: